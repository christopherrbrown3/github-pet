name: Swift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # The suite is swift-testing only; skip the empty XCTest pass.
        run: scripts/test.sh --disable-xctest
      - name: Bundle app
        run: scripts/build-app.sh release
      - name: Verify bundle
        run: |
          plutil -lint .build/app/GitHubPet.app/Contents/Info.plist
          codesign --verify --strict .build/app/GitHubPet.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' .build/app/GitHubPet.app/Contents/Info.plist)" = true
