name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep PR build/tests on GitHub's combined branch; metadata needs complete history.
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # The suite is swift-testing only; skip the empty XCTest pass.
        run: scripts/test.sh --disable-xctest --skip '\bdescendantHoldingThePipeDoesNotLeakReadsOrDescriptors\b'
      - name: Descriptor cleanup (isolated process)
        timeout-minutes: 2
        # /dev/fd counts are process-wide; other suites may launch children or initialize
        # AppKit descriptors. Keep the exact assertion in a process with this test alone.
        run: |
          set -o pipefail
          scripts/test.sh --skip-build --disable-xctest --filter '\bdescendantHoldingThePipeDoesNotLeakReadsOrDescriptors\b' | tee .build/descriptor-isolated.log
          python3 - <<'PYGUARD'
          import re
          from pathlib import Path
          log = Path('.build/descriptor-isolated.log').read_text()
          named = r'^✔ Test descendantHoldingThePipeDoesNotLeakReadsOrDescriptors\(\) passed\b'
          summary = r'^✔ Test run with 1 test(?: in [0-9]+ suites?)? passed\b'
          assert len(re.findall(named, log, re.MULTILINE)) == 1, 'descriptor test must pass exactly once'
          assert '✘' not in log, 'isolated run contains a failure'
          assert len(re.findall(summary, log, re.MULTILINE)) == 1, 'isolated run must report exactly one passing test'
          PYGUARD
      - name: External public CommandRunner API
        timeout-minutes: 2
        run: scripts/test-public-budget.sh
      - name: Dismissal startup persistence across processes
        timeout-minutes: 2
        run: scripts/test-dismissal-durability.sh
      - name: Check out PR head for packaging
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          # Downloadable artifacts identify the actual PR source, not an ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify packaging source and history
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" -gt 1
      - name: Packaging provenance regression
        timeout-minutes: 2
        run: scripts/test-packaging.sh
      - name: Package app (universal ZIP)
        # Builds the arm64 + x86_64 app the checks below use, zips it and self-verifies the archive.
        run: scripts/package-zip.sh
      - name: Verify bundle
        run: |
          plutil -lint .build/app/GitHubPet.app/Contents/Info.plist
          codesign --verify --strict .build/app/GitHubPet.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' .build/app/GitHubPet.app/Contents/Info.plist)" = true
          python3 scripts/mascot-resources.py verify .build/app/GitHubPet.app/Contents/Resources/MascotPacks
      - name: GUI render check
        timeout-minutes: 7
        run: scripts/render-check.sh
      - name: Intel slice smoke (Rosetta)
        timeout-minutes: 2
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
             git diff --quiet "$PR_BASE_SHA...HEAD" -- .github/workflows/swift.yml scripts/intel-smoke.sh scripts/test-packaging.sh; then
            echo "Intel smoke is not selected for this PR's changed paths."
            exit 0
          fi
          scripts/intel-smoke.sh
      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GitHubPet-app
          path: |
            .build/dist/*.zip
            .build/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          # Already compressed.
          compression-level: 0
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: .build/render-check
          if-no-files-found: ignore
      - name: Upload Intel smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-smoke
          path: .build/intel-smoke
          if-no-files-found: ignore
