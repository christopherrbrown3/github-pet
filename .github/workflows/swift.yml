name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release candidate version, e.g. 0.1.0-beta.4 (empty: ordinary build). Run on main for a publishable ZIP.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep PR build/tests on GitHub's combined branch; metadata needs complete history.
          fetch-depth: 0
      - name: Release version
        # Only a manual run with release_version makes a release build; its version reaches
        # package-zip.sh as RELEASE_VERSION and the app's Info.plist. A tag push does not rebuild:
        # the published ZIP is the dispatch-run artifact QA verified (docs/updates.md).
        id: release
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ -n "$version" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$version' is not a release version like 0.1.0 or 0.1.0-beta.4"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # The suite is swift-testing only; skip the empty XCTest pass.
        run: scripts/test.sh --disable-xctest --skip '\bdescendantHoldingThePipeDoesNotLeakReadsOrDescriptors\b'
      - name: Descriptor cleanup (isolated process)
        timeout-minutes: 2
        # /dev/fd counts are process-wide; other suites may launch children or initialize
        # AppKit descriptors. Keep the exact assertion in a process with this test alone.
        run: |
          set -o pipefail
          scripts/test.sh --skip-build --disable-xctest --filter '\bdescendantHoldingThePipeDoesNotLeakReadsOrDescriptors\b' | tee .build/descriptor-isolated.log
          python3 - <<'PYGUARD'
          import re
          from pathlib import Path
          log = Path('.build/descriptor-isolated.log').read_text()
          named = r'^✔ Test descendantHoldingThePipeDoesNotLeakReadsOrDescriptors\(\) passed\b'
          summary = r'^✔ Test run with 1 test(?: in [0-9]+ suites?)? passed\b'
          assert len(re.findall(named, log, re.MULTILINE)) == 1, 'descriptor test must pass exactly once'
          assert '✘' not in log, 'isolated run contains a failure'
          assert len(re.findall(summary, log, re.MULTILINE)) == 1, 'isolated run must report exactly one passing test'
          PYGUARD
      - name: External public CommandRunner API
        timeout-minutes: 2
        run: scripts/test-public-budget.sh
      - name: Dismissal startup persistence across processes
        timeout-minutes: 2
        run: scripts/test-dismissal-durability.sh
      - name: Check out PR head for packaging
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          # Downloadable artifacts identify the actual PR source, not an ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify packaging source and history
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" -gt 1
      - name: Packaging provenance regression
        timeout-minutes: 2
        run: scripts/test-packaging.sh
      - name: Release appcast regression
        timeout-minutes: 2
        run: scripts/test-release-appcast.sh
      - name: Package app (universal ZIP)
        # Builds the arm64 + x86_64 app the checks below use, zips it and self-verifies the archive.
        # RELEASE_VERSION is set for this step only (empty for ordinary builds), so the regression
        # scripts that build their own apps are never affected by it.
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: scripts/package-zip.sh
      - name: Verify bundle
        run: |
          plutil -lint .build/app/GitHubPet.app/Contents/Info.plist
          codesign --verify --strict .build/app/GitHubPet.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' .build/app/GitHubPet.app/Contents/Info.plist)" = true
          codesign --verify --deep --strict .build/app/GitHubPet.app
          scripts/verify-app-icon.sh .build/app/GitHubPet.app
          python3 scripts/mascot-resources.py verify .build/app/GitHubPet.app/Contents/Resources/MascotPacks
      - name: Verify release build
        if: steps.release.outputs.version != ''
        run: |
          plist=.build/app/GitHubPet.app/Contents/Info.plist
          version="${{ steps.release.outputs.version }}"
          key=$(grep -v '^[[:space:]]*#' updates/sparkle-public-ed-key.txt | tr -d '[:space:]')
          test -n "$key"
          test "$(/usr/libexec/PlistBuddy -c 'Print :GitHubPetReleaseVersion' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" = "$key"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" = "https://raw.githubusercontent.com/christopherrbrown3/github-pet/main/updates/appcast.xml"
          zip=$(ls .build/dist/*.zip)
          {
            echo "## Release build $version"
            echo "- Source: \`$GITHUB_SHA\`, build number $(git rev-list --count HEAD)"
            echo "- ZIP: \`$(basename "$zip")\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 < "$zip.sha256")\`"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "Run on main: QA verifies this artifact and the release publishes this exact ZIP. Create the tag at \`$GITHUB_SHA\`; do not rebuild."
            else
              echo "**TEST ONLY: not run on main, do not publish this ZIP.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: GUI render check
        timeout-minutes: 9
        run: scripts/render-check.sh
      - name: Intel slice smoke (Rosetta)
        timeout-minutes: 2
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
             git diff --quiet "$PR_BASE_SHA...HEAD" -- .github/workflows/swift.yml scripts/intel-smoke.sh scripts/test-packaging.sh; then
            echo "Intel smoke is not selected for this PR's changed paths."
            exit 0
          fi
          scripts/intel-smoke.sh
      - name: Sparkle packaging regression
        timeout-minutes: 10
        # Builds debug apps (QA overrides, then defaults), so run it after every step that uses the packaged app in .build/app.
        run: scripts/test-update-build.sh
      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.version != '' && format('GitHubPet-release-{0}', steps.release.outputs.version) || 'GitHubPet-app' }}
          path: |
            .build/dist/*.zip
            .build/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          # Already compressed.
          compression-level: 0
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: .build/render-check
          if-no-files-found: ignore
      - name: Upload Intel smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-smoke
          path: .build/intel-smoke
          if-no-files-found: ignore
