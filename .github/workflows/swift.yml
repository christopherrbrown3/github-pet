name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep PR build/tests on GitHub's combined branch; metadata needs complete history.
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # The suite is swift-testing only; skip the empty XCTest pass.
        run: scripts/test.sh --disable-xctest
      - name: Check out PR head for packaging
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          # Downloadable artifacts identify the actual PR source, not an ephemeral merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify packaging source and history
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" -gt 1
      - name: Packaging provenance regression
        timeout-minutes: 2
        run: scripts/test-packaging.sh
      - name: Package app (universal ZIP)
        # Builds the arm64 + x86_64 app the checks below use, zips it and self-verifies the archive.
        run: scripts/package-zip.sh
      - name: Verify bundle
        run: |
          plutil -lint .build/app/GitHubPet.app/Contents/Info.plist
          codesign --verify --strict .build/app/GitHubPet.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' .build/app/GitHubPet.app/Contents/Info.plist)" = true
          test -f .build/app/GitHubPet.app/Contents/Resources/MascotPacks/mona-pet-v1/manifest.json
          test "$(ls .build/app/GitHubPet.app/Contents/Resources/MascotPacks/mona-pet-v1/frames/*.png | wc -l)" -eq 12
      - name: GUI render check
        timeout-minutes: 5
        run: scripts/render-check.sh
      - name: Intel slice smoke (Rosetta)
        # Not on PRs, to keep them fast (pushes to main and manual runs); prints SKIP without Rosetta.
        if: github.event_name != 'pull_request'
        timeout-minutes: 6
        run: scripts/intel-smoke.sh
      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GitHubPet-app
          path: |
            .build/dist/*.zip
            .build/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          # Already compressed.
          compression-level: 0
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: .build/render-check
          if-no-files-found: ignore
